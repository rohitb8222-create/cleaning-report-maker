<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sumeet Elko - Online PPT Maker</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body { font-family: 'Arial', sans-serif; background: #f0f2f5; margin: 0; padding: 20px; text-align: center; }
        .nav-bar { background: white; padding: 20px; border-radius: 12px; display: inline-block; margin-bottom: 30px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        
        /* Slide Styling */
        .slide {
            width: 960px; height: 540px;
            background-image: url('bg.jpg.jpg'); /* GitHub वरील इमेज डायरेक्ट लोड होईल */
            background-size: 100% 100%;
            background-repeat: no-repeat;
            position: relative;
            margin: 20px auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            display: flex; justify-content: center; align-items: center;
        }

        .title-container {
            position: absolute; left: 60px; top: 35%;
            width: 500px; text-align: left;
        }
        .main-title { font-family: 'Impact', sans-serif; font-size: 70px; color: #1e3a8a; outline: none; }

        .image-wrapper {
            display: flex; width: 90%; height: 68%;
            gap: 20px; margin-top: 55px;
        }
        .img-box {
            flex: 1; height: 100%;
            border: 5px solid white;
            box-shadow: 0 5px 10px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        .img-box img { width: 100%; height: 100%; object-fit: fill; }

        button { padding: 12px 25px; font-weight: bold; cursor: pointer; border-radius: 8px; border: none; margin: 10px; }
        .btn-blue { background: #2563eb; color: white; }
        .btn-green { background: #16a34a; color: white; }
    </style>
</head>
<body>

<div class="nav-bar">
    <h2 style="margin:0 0 15px 0;">Sumeet Elko PPT Tool 🛠️</h2>
    <strong>१. कामाचे फोटो निवडा (Multi-Select):</strong><br>
    <input type="file" id="multiImageInput" accept="image/*" multiple><br>
    <button class="btn-blue" onclick="generateSlides()">Generate Report</button>
    <button class="btn-green" onclick="downloadPDF()">Download PDF</button>
</div>

<div id="container">
    <div id="firstPage" class="slide">
        <div class="title-container">
            <div class="main-title" contenteditable="true">DEEP CLEANING DRIVE</div>
            <div style="font-size: 24px; color: #444;" contenteditable="true">Location: Kalyan-Dombivli</div>
        </div>
    </div>
</div>

<script>
    async function generateSlides() {
        const container = document.getElementById('container');
        const files = document.getElementById('multiImageInput').files;
        if (files.length === 0) return alert("फोटो निवडा!");

        const firstPage = document.getElementById('firstPage');
        container.innerHTML = "";
        container.appendChild(firstPage);

        for (let i = 0; i < files.length; i += 2) {
            const slide = document.createElement('div');
            slide.className = 'slide';
            
            const wrapper = document.createElement('div');
            wrapper.className = 'image-wrapper';

            await addImg(files[i], wrapper);
            if (files[i+1]) await addImg(files[i+1], wrapper);

            slide.appendChild(wrapper);
            container.appendChild(slide);
        }
    }

    function addImg(file, parent) {
        return new Promise((res) => {
            const r = new FileReader();
            r.onload = (e) => {
                const box = document.createElement('div');
                box.className = 'img-box';
                box.innerHTML = `<img src="${e.target.result}">`;
                parent.appendChild(box);
                res();
            };
            r.readAsDataURL(file);
        });
    }

    async function downloadPDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF('l', 'px', [960, 540]);
        const slides = document.querySelectorAll('.slide');
        for (let i = 0; i < slides.length; i++) {
            const canvas = await html2canvas(slides[i], { scale: 1.5 });
            if (i > 0) doc.addPage();
            doc.addImage(canvas.toDataURL('image/jpeg', 0.9), 'JPEG', 0, 0, 960, 540);
        }
        doc.save("Report.pdf");
    }
</script>
</body>
</html>
